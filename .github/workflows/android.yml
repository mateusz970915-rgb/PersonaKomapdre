name: Android CI

on:
  push:
    branches:
      - "main"
      - "master"
      - "build/**"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  build-attached-personamesh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Extract prepared PersonaMesh source
        shell: bash
        run: |
          set -euo pipefail
          test -s personamesh-v5-production-debug-prepared-2026-08-30.zip
          rm -rf personamesh-attached
          mkdir personamesh-attached
          unzip -q personamesh-v5-production-debug-prepared-2026-08-30.zip -d personamesh-attached
          chmod +x personamesh-attached/gradlew
          unzip -t personamesh-attached/gradle/wrapper/gradle-wrapper.jar >/dev/null

      - name: Verify prepared assets
        working-directory: personamesh-attached
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d "" file; do
            case "$file" in
              *.jpg|*.jpeg) file "$file" | grep -q "JPEG image data" ;;
              *.webp) file "$file" | grep -q "RIFF .*Web/P image" ;;
            esac
          done < <(find app/src/main/res -type f -print0)

      - name: Upload prepared source for repair
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: personamesh-source-for-repair
          path: personamesh-attached
          if-no-files-found: error
          retention-days: 7

      - name: Run production lint
        working-directory: personamesh-attached
        run: ./gradlew :app:lintProductionDebug --stacktrace

      - name: Run production unit tests
        working-directory: personamesh-attached
        run: ./gradlew :app:testProductionDebugUnitTest --stacktrace

      - name: Build production debug APK
        working-directory: personamesh-attached
        run: ./gradlew :app:assembleProductionDebug --stacktrace

      - name: Upload production debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: personamesh-production-debug-apk
          path: personamesh-attached/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
