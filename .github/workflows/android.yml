name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify Binary Assets
      run: |
        #!/bin/bash
        echo "Verifying binary assets..."
        for file in $(find app/src/main/res -name "*.webp" -o -name "*.png" -o -name "*.jpg"); do
          if ! file "$file" | grep -qE "image|Web/P image|PNG image data|JPEG image data"; then
            echo "Corrupt image found: $file"
            exit 1
          fi
        done

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug
